name: AI-Agent CI/CD

on:
    push:
        branches: [master]

permissions:
    contents: read
    id-token: write

env: 
    IMAGE: europe-west1-docker.pkg.dev/ai-cats-502309/ai-cat/backend

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            
            - name: Install ruff
              run: pip install ruff

            - name: Run ruff
              run: ruff check