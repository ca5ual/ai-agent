name: Deploy Frontend to Cloud Storage

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

env:
  BUCKET_NAME: ai-cat-frontend-ca5ual
  GCP_PROJECT_ID: ai-agent-cat

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set project ID
        run: gcloud config set project ${{ env.GCP_PROJECT_ID }}

      - name: Debug - Verify auth
        run: |
          echo "Project: $(gcloud config get-value project)"
          echo "Account: $(gcloud auth list --filter=status:ACTIVE --format='value(account)')"

      - name: Upload files to Cloud Storage
        run: |
          gcloud storage cp frontend/index.html gs://${{ env.BUCKET_NAME }}/